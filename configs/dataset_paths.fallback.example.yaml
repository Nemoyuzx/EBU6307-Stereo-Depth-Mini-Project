# Engineering-only fallback example for the EBU6307 project.
# Use this only when no official Middlebury-style assignment data is available yet.
# Keep fallback inputs and outputs separate from final submission data.

local:
  repo_root: .
  datasets_root: workspace/data
  middlebury_root: workspace/data/tmp_remote_stereo_fallback

remote:
  repo_root: .
  datasets_root: workspace/data
  middlebury_root: workspace/data/tmp_remote_stereo_fallback

results:
  # Keep engineering fallback outputs out of the default assignment result folders.
  o1b_synthetic_dir: results/O1b_synthetic_data_fallback
  o1c_metrics_file: results/O1c_synthetic_data/fallback_SSIM.csv

o1:
  shift_pixels: 8
