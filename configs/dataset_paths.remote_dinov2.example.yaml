# Remote-only O4 DINOv2 run profile.
# Keeps the DINOv2 outputs separate from the default O4 baseline folders.

remote:
  repo_root: .
  datasets_root: workspace/data
  middlebury_root: workspace/data/middlebury

results:
  # a folders: pipeline / architecture assets only; b folders: scene-level outputs.
  o4a_transformer_dir: results/O4a_transformer_dinov2
  o4b_transformer_dir: results/O4b_transformer_dinov2
  o4c_metrics_file: results/O4c_transformer_dinov2/metrics.csv
  o4c_fold_metrics_file: results/O4c_transformer_dinov2/fold_summary.csv

o4:
  downsample_factor: 1
  patch_size: 2
  max_disparity: 288
  min_disparity: 0
  min_confidence: 0.02
  token_median_filter_size: 3
  backend: auto
  # Use GPU1 on the remote machine to avoid occupying GPU0.
  device: cuda:1
  prefer_cuda: true
  execution_mode: dinov2_cost_volume
  dinov2_model_name: facebook/dinov2-base
  # DINOv2 patch size is 14; scale=7 lowers the effective token span to 2 px.
  dinov2_input_scale: 7
  dinov2_repo_path: workspace/external/dinov2
  dinov2_checkpoint_path: /limx_embop/tos/users/Nemo/self-work/models/dinov2_vitb14_reg4_pretrain.pth
  model_dim: 96
  encoder_hidden_dim: 384
  encoder_layers: 3
  disparity_regression: quadratic
  training_epochs: 12
  training_learning_rate: 0.0005
  training_batch_size: 1024
  inference_batch_size: 4096
  negative_samples: 8
  max_training_samples: 12000
  weight_decay: 0.0003
  fine_detail_weight: 0.0
  consistency_threshold: 1.0
  fill_invalid_passes: 2
  random_seed: 0