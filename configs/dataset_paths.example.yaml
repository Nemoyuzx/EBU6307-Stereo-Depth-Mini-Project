# Example dataset and output roots for the EBU6307 project.
# Copy to a local untracked config later if needed.

local:
  repo_root: /Users/nemoyu/Desktop/openclaw-operate
  datasets_root: /Users/nemoyu/Desktop/openclaw-operate/data
  middlebury_root: /Users/nemoyu/Desktop/openclaw-operate/data

remote:
  repo_root: /root/code/new_folder/openclaw-operate
  datasets_root: /root/code/new_folder/openclaw-operate/workspace/data
  middlebury_root: /root/code/new_folder/openclaw-operate/workspace/data/middlebury

results:
  o1b_synthetic_dir: results/O1b_synthetic_data
  o1c_metrics_file: results/O1c_synthetic_data/SSIM.csv
  o2a_sift_dir: results/O2a_sift
  o2b_sift_dir: results/O2b_sift
  o2c_metrics_file: results/O2c_sift/metrics.csv
  o3a_disparity_dir: results/O3a_disparity
  o3b_disparity_dir: results/O3b_disparity
  o3c_metrics_file: results/O3c_disparity/metrics.csv
  o4a_transformer_dir: results/O4a_transformer
  o4b_transformer_dir: results/O4b_transformer
  o4c_metrics_file: results/O4c_transformer/metrics.csv
  o4c_fold_metrics_file: results/O4c_transformer/fold_summary.csv

o1:
  shift_pixels: 8
  method: shift
  superpixel_count: 400
  superpixel_cluster_count: 12
  device: auto
  output_tag: ""

o2:
  max_features: 800
  contrast_threshold: 0.04
  ratio_test: 0.8
  max_draw_matches: 80

o3:
  max_features: 800
  contrast_threshold: 0.04
  ratio_test: 0.8
  max_draw_matches: 80
  num_disparities: 96
  max_vertical_offset: 2.0
  block_size: 9
  uniqueness_ratio: 8
  speckle_window_size: 100
  speckle_range: 8
  disp12_max_diff: 1
  median_filter_size: 3
  census_window_size: 5
  census_weight: 3.0
  gradient_weight: 1.0
  consistency_threshold: 1.0
  fill_invalid_passes: 2

o4:
  num_folds: 5
  downsample_factor: 1
  patch_size: 2
  max_disparity: 96
  min_disparity: 0
  min_confidence: 0.02
  token_median_filter_size: 3
  backend: auto
  device: auto
  prefer_cuda: true
  execution_mode: baseline
  dinov2_model_name: facebook/dinov2-base
  dinov2_repo_path: /path/to/facebookresearch/dinov2
  dinov2_checkpoint_path: /limx_embop/tos/users/Nemo/self-work/models/dinov2_vitb14_reg4_pretrain.pth
  model_dim: 48
  encoder_hidden_dim: 96
  encoder_layers: 2
  disparity_regression: quadratic
  softmax_temperature: 1.0
  training_epochs: 24
  training_learning_rate: 0.001
  training_batch_size: 1024
  inference_batch_size: 4096
  negative_samples: 6
  max_training_samples: 20000
  weight_decay: 0.0001
  context_window_size: 3
  fine_detail_weight: 0.35
  consistency_threshold: 1.0
  fill_invalid_passes: 2
  random_seed: 0

