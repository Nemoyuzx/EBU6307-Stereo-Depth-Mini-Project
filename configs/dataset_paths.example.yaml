# Example dataset and output roots for the EBU6307 project.
# Copy to a local untracked config later if needed.

local:
  repo_root: .
  datasets_root: data
  middlebury_root: data

remote:
  repo_root: .
  datasets_root: workspace/data
  middlebury_root: workspace/data/middlebury

results:
  o1b_synthetic_dir: results/O1b_synthetic_data
  o1c_metrics_file: results/O1c_synthetic_data/SSIM.csv
  o2a_sift_dir: results/O2a_sift
  o2b_sift_dir: results/O2b_sift
  o2c_metrics_file: results/O2c_sift/metrics.csv
  o3a_disparity_dir: results/O3a_disparity
  o3b_disparity_dir: results/O3b_disparity
  o3c_metrics_file: results/O3c_disparity/metrics.csv
  o4a_transformer_dir: results/O4a_transformer
  o4b_transformer_dir: results/O4b_transformer
  o4c_metrics_file: results/O4c_transformer/metrics.csv
  o4c_fold_metrics_file: results/O4c_transformer/fold_summary.csv

o1:
  shift_pixels: 8
  method: shift
  superpixel_count: 400
  superpixel_cluster_count: 12
  device: auto
  output_tag: ""

o2:
  max_features: 800
  contrast_threshold: 0.04
  ratio_test: 0.8
  max_draw_matches: 80

o3:
  max_features: 800
  contrast_threshold: 0.04
  ratio_test: 0.8
  max_draw_matches: 80
  num_disparities: 96
  max_vertical_offset: 2.0
  block_size: 5
  uniqueness_ratio: 0
  speckle_window_size: 0
  speckle_range: 8
  disp12_max_diff: 1
  median_filter_size: 3
  census_window_size: 5
  census_weight: 3.0
  gradient_weight: 1.0
  consistency_threshold: 1.0
  fill_invalid_passes: 0

o4:
  num_folds: 5
  downsample_factor: 1
  patch_size: 2
  max_disparity: 288
  min_disparity: 0
  min_confidence: 0.005
  token_median_filter_size: 5
  backend: auto
  # Use GPU 0 on the remote/school CUDA machine.
  device: cuda:0
  prefer_cuda: true
  # execution_mode 取值：baseline (token argmin + LR consistency)、
  #                   baseline_sgm (ViT 余弦得分 → O3 风格 SGM 聚合)、
  #                   dinov2_cost_volume (DINOv2 特征代价体)。
  execution_mode: baseline_sgm
  dinov2_model_name: facebook/dinov2-base
  dinov2_repo_path: workspace/external/dinov2
  dinov2_checkpoint_path: workspace/checkpoints/dinov2_vitb14_reg4_pretrain.pth
  model_dim: 96
  encoder_hidden_dim: 384
  encoder_layers: 4
  disparity_regression: quadratic
  softmax_temperature: 1.0
  training_epochs: 90
  training_learning_rate: 0.0005
  training_batch_size: 1536
  inference_batch_size: 4096
  negative_samples: 12
  max_training_samples: 60000
  weight_decay: 0.0003
  context_window_size: 3
  fine_detail_weight: 0.0
  consistency_threshold: 1.0
  fill_invalid_passes: 4
  speckle_max_size: 100
  speckle_max_diff: 1.5
  random_seed: 0

